name: Build FFmpeg binaries (manual)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: Stable FFmpeg source release
        required: true
        default: "9.0.2"
        type: string
      publish:
        description: Publish verified binaries to the PulseSync updater release
        required: true
        default: false
        type: boolean

concurrency:
  group: ffmpeg-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}-${{ matrix.arch }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            arch: x86_64

          - runner: macos-26-intel
            target: macos
            arch: x86_64

          - runner: macos-26
            target: macos
            arch: arm64

          - runner: windows-latest
            target: windows
            arch: x86_64

    runs-on: ${{ matrix.runner }}
    env:
      FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Restore source and compiler caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            .build/downloads
            .build/ccache
          key: ffmpeg-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('.github/scripts/build-ffmpeg.sh') }}-${{ inputs.ffmpeg_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ffmpeg-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('.github/scripts/build-ffmpeg.sh') }}-${{ inputs.ffmpeg_version }}-
            ffmpeg-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('.github/scripts/build-ffmpeg.sh') }}-

      - name: Install Windows build tools
        if: matrix.target == 'windows'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel automake-wrapper curl gnupg nasm
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-ccache

      - name: Build Windows binary
        if: matrix.target == 'windows'
        shell: msys2 {0}
        run: bash .github/scripts/build-ffmpeg.sh

      - name: Install macOS build tools
        if: matrix.target == 'macos'
        shell: bash
        run: brew install automake nasm pkg-config gnupg ccache

      - name: Build macOS binary
        if: matrix.target == 'macos'
        shell: bash
        run: bash .github/scripts/build-ffmpeg.sh

      - name: Build static Linux binary with musl
        if: matrix.target == 'linux'
        shell: bash
        run: |
          docker run --rm \
            -e FFMPEG_VERSION -e BUILD_TARGET -e BUILD_ARCH \
            -v "$PWD:/workspace" -w /workspace alpine:3.22 \
            sh -ec 'apk add --no-cache bash build-base automake curl gnupg nasm perl pkgconf linux-headers zlib-dev zlib-static ccache && bash .github/scripts/build-ffmpeg.sh'

      - name: Check Windows binary without the MSYS2 runtime on PATH
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & ./dist/bin/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg cannot run independently of MSYS2" }

      - name: Upload verified build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ffmpeg-${{ matrix.target }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release assets
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8.0.2

      - name: Create or update updater release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ffmpeg-binaries
          name: FFmpeg ${{ inputs.ffmpeg_version }} binaries
          body: |
            FFmpeg ${{ inputs.ffmpeg_version }} built from signed upstream sources for PulseSync.
            Build configuration, source checksums and licenses are included in the per-platform source archives.
            The .sha256 files contain the SHA-256 of the executable, as required by the PulseSync updater.
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ffmpeg-*/ffmpeg-*.tar.gz
            ffmpeg-*/ffmpeg-*.sha256
